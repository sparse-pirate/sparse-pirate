<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d3d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff3d3d"/>
      <stop offset="1" stop-color="#ff3d3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="1000" height="2" fill="#1b2129"/>
  <rect y="3" width="240" height="2" fill="url(#hl)">
    <animate attributeName="x" values="-240;1000" dur="4s" repeatCount="indefinite"/>
  </rect>
