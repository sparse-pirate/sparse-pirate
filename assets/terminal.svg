<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Terminal showing who Parse is, the mission, stack and progress" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace; font-size: 15px; }
    .p { fill: #39ff88; }
    .c { fill: #f2f5f8; }
    .o { fill: #8b95a3; }
    .r { fill: #ff3d3d; }
    .g { fill: #39ff88; }
  </style>
  <rect x="1" y="1" width="918" height="398" rx="10" fill="#0d1014" stroke="#232a33"/>
  <path d="M1 11a10 10 0 0 1 10-10h898a10 10 0 0 1 10 10V35H1z" fill="#141920"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text class="mono o" x="460" y="23" font-size="13" text-anchor="middle">parse@redteam: ~</text>

  <g class="mono">
    <g><text x="28" y="76"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.04;.044;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="102" class="o">parse // residential engineer by day, pentester by night</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.10;.104;.94;1" dur="18s" repeatCount="indefinite"/></g>

    <g><text x="28" y="136"><tspan class="p">$ </tspan><tspan class="c">cat mission.txt</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.17;.174;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="162"><tspan class="o">junior pentester now. </tspan><tspan class="r">red team operator later.</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.23;.234;.94;1" dur="18s" repeatCount="indefinite"/></g>

    <g><text x="28" y="196"><tspan class="p">$ </tspan><tspan class="c">ls ~/stack</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.304;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="222" class="o">active-directory  esxi  docker  selinux  python  opencv</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.36;.364;.94;1" dur="18s" repeatCount="indefinite"/></g>

    <g><text x="28" y="256"><tspan class="p">$ </tspan><tspan class="c">tail -n 3 progress.log</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.43;.434;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="282"><tspan class="g">[done] </tspan><tspan class="o">pre security</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.494;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="304"><tspan class="g">[done] </tspan><tspan class="o">john, hydra, gobuster, metasploit rooms</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.54;.544;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="326"><tspan class="r">[live] </tspan><tspan class="c">cyber security 101</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.59;.594;.94;1" dur="18s" repeatCount="indefinite"/></g>

    <g><text x="28" y="360"><tspan class="p">$ </tspan><tspan class="c">./next_move.sh</tspan></text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.684;.94;1" dur="18s" repeatCount="indefinite"/></g>
    <g><text x="28" y="384"><tspan class="r">&gt; </tspan><tspan class="c">own the next box</tspan></text>
      <rect x="198" y="371" width="9" height="16" class="g">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.754;.94;1" dur="18s" repeatCount="indefinite"/></g>
  </g>
</svg>
