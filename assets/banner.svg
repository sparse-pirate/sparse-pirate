<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Parse, pentester in progress, red teamer by design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace; }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141920" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3d3d" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff3d3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d3d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff3d3d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff3d3d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="60" y="150" height="40" width="640">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="280" fill="#0a0c0f"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <rect width="1000" height="280" fill="url(#glow)"/>
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <path d="M20 50V20H50 M950 20H980V50 M980 230V260H950 M50 260H20V230" stroke="#ff3d3d" stroke-width="2" fill="none"/>

  <g transform="translate(820 140)">
    <circle r="80" fill="none" stroke="#252c36" stroke-width="1"/>
    <circle r="54" fill="none" stroke="#ff3d3d" stroke-width="1.5" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#ff3d3d" stroke-width="1"/>
    <path d="M-104 0H-36 M36 0H104 M0 -104V-36 M0 36V104" stroke="#ff3d3d" stroke-width="1.5"/>
    <circle r="4" fill="#ff3d3d">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text class="mono" x="60" y="66" font-size="13" fill="#5b6572" letter-spacing="3" textLength="520" lengthAdjust="spacingAndGlyphs">// OPERATOR PROFILE  ::  BENGALURU, IN</text>

  <g class="mono" font-weight="800" font-size="96">
    <text x="60" y="146" fill="#2ee6c5" opacity=".55" textLength="340" lengthAdjust="spacingAndGlyphs">PARSE
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 1;3 -1;0 0;0 0" keyTimes="0;.80;.82;.85;.87;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="146" fill="#ff3d3d" opacity=".7" textLength="340" lengthAdjust="spacingAndGlyphs">PARSE
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 -1;-3 1;0 0;0 0" keyTimes="0;.80;.82;.85;.87;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="146" fill="#f2f5f8" textLength="340" lengthAdjust="spacingAndGlyphs">PARSE</text>
  </g>

  <g clip-path="url(#typeclip)">
    <text class="mono" x="60" y="182" font-size="23" fill="#39ff88" textLength="640" lengthAdjust="spacingAndGlyphs">&gt; pentester in progress. red teamer by design.</text>
  </g>
  <rect x="700" y="164" width="12" height="22" fill="#39ff88">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="214" x2="700" y2="214" stroke="#1b2129" stroke-width="1"/>
  <text class="mono" x="60" y="242" font-size="12" fill="#5b6572" letter-spacing="2" textLength="640" lengthAdjust="spacingAndGlyphs">STATUS: LEARNING IN PUBLIC  //  DAY JOB: ~400 SYSTEMS ON THE DOMAIN</text>
</svg>
