<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Mission map: Pre Security done, Cyber Security 101 in progress, then Junior Pentester path, eJPT, PNPT, OSCP, red team" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace; text-anchor: middle; }
    .t { font-size: 12px; font-weight: 700; fill: #e8ecf1; letter-spacing: 1px; }
    .s { font-size: 11px; fill: #5b6572; }
    .sl { font-size: 11px; fill: #ff3d3d; }
    .sd { font-size: 11px; fill: #39ff88; }
  </style>
  <rect width="1000" height="210" fill="#0a0c0f"/>

  <line x1="70" y1="100" x2="213" y2="100" stroke="#39ff88" stroke-width="2"/>
  <line x1="213" y1="100" x2="928" y2="100" stroke="#3a4350" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- 01 done -->
  <circle cx="70" cy="100" r="16" fill="#0a0c0f" stroke="#39ff88" stroke-width="2"/>
  <path d="M62 100l6 6 11-12" fill="none" stroke="#39ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono t" x="70" y="140">PRE SECURITY</text>
  <text class="mono sd" x="70" y="158">complete</text>

  <!-- 02 live -->
  <circle cx="213" cy="100" r="18" fill="none" stroke="#ff3d3d" stroke-width="2">
    <animate attributeName="r" values="18;36" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="213" cy="100" r="18" fill="#ff3d3d"/>
  <circle cx="213" cy="100" r="6" fill="#0a0c0f"/>
  <rect x="159" y="30" width="108" height="24" rx="4" fill="#ff3d3d"/>
  <polygon points="205,54 221,54 213,63" fill="#ff3d3d"/>
  <text class="mono" x="213" y="46" font-size="11" font-weight="800" fill="#0a0c0f" letter-spacing="1">YOU ARE HERE</text>
  <text class="mono t" x="213" y="140">CYBER SEC 101</text>
  <text class="mono sl" x="213" y="158">in progress</text>

  <!-- 03 -->
  <circle cx="356" cy="100" r="14" fill="#0a0c0f" stroke="#3a4350" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="mono t" x="356" y="140" style="fill:#8b95a3">JR PENTESTER</text>
  <text class="mono s" x="356" y="158">thm path</text>

  <!-- 04 -->
  <circle cx="499" cy="100" r="14" fill="#0a0c0f" stroke="#3a4350" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="mono t" x="499" y="140" style="fill:#8b95a3">eJPT</text>
  <text class="mono s" x="499" y="158">cert 1</text>

  <!-- 05 -->
  <circle cx="642" cy="100" r="14" fill="#0a0c0f" stroke="#3a4350" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="mono t" x="642" y="140" style="fill:#8b95a3">PNPT</text>
  <text class="mono s" x="642" y="158">cert 2</text>

  <!-- 06 -->
  <circle cx="785" cy="100" r="14" fill="#0a0c0f" stroke="#3a4350" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="mono t" x="785" y="140" style="fill:#8b95a3">OSCP</text>
  <text class="mono s" x="785" y="158">cert 3</text>

  <!-- 07 goal -->
  <g transform="translate(928 100)">
    <circle r="22" fill="#0a0c0f" stroke="#ff3d3d" stroke-width="2"/>
    <circle r="9" fill="none" stroke="#ff3d3d" stroke-width="1.5"/>
    <path d="M-30 0H-13 M13 0H30 M0 -30V-13 M0 13V30" stroke="#ff3d3d" stroke-width="2"/>
    <circle r="3" fill="#ff3d3d"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <text class="mono t" x="928" y="150" style="fill:#ff3d3d">RED TEAM</text>
  <text class="mono s" x="928" y="168">the goal</text>
</svg>
